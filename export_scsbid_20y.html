<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>낙찰 데이터 직접수집</title></head>
<body style="font-family:sans-serif;padding:24px;background:#0D1B3E;color:#fff;max-width:760px;margin:0 auto">
<h2>📊 낙찰 데이터 직접수집 → 엑셀</h2>
<p style="color:#9db3d8;font-size:14px;line-height:1.7">
Firestore와 무관하게 나라장터 API에서 바로 수집합니다.<br>
업체명·사업자번호·대표자명·주소·전화번호·낙찰금액·낙찰률·수요기관·공고명·개찰일·참가업체수 등 <b>API 제공 필드 전체</b>를 낙찰 건별로 저장합니다.
</p>
<div style="background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.4);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.7">
⚠️ 하루 API 호출 한도(보통 1,000회)를 넘으면 자동 중단됩니다. 아무 때나 <b>[⏸ 중지하고 지금까지 저장]</b>으로 그때까지 모은 데이터를 받을 수 있습니다.
</div>

<div style="background:rgba(255,255,255,.06);border-radius:10px;padding:16px;margin-bottom:16px">
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:10px">
    <div>
      <label style="font-size:11px;color:#9db3d8;display:block;margin-bottom:4px">시작일</label>
      <input type="date" id="startDate" style="padding:8px;border-radius:6px;border:none;font-size:13px">
    </div>
    <div>
      <label style="font-size:11px;color:#9db3d8;display:block;margin-bottom:4px">종료일</label>
      <input type="date" id="endDate" style="padding:8px;border-radius:6px;border:none;font-size:13px">
    </div>
    <button id="preset20" style="padding:8px 12px;border-radius:6px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:12px;cursor:pointer">최근 20년</button>
    <button id="preset5" style="padding:8px 12px;border-radius:6px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:12px;cursor:pointer">최근 5년</button>
    <button id="preset1" style="padding:8px 12px;border-radius:6px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:12px;cursor:pointer">최근 1년</button>
  </div>
  <div id="rangeInfo" style="font-size:11px;color:#7BAAF7"></div>
</div>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
  <button id="btn" style="background:#C8A84B;color:#0D1B3E;border:none;padding:14px 24px;font-size:15px;font-weight:800;border-radius:10px;cursor:pointer">🚀 수집 시작</button>
  <button id="stopBtn" style="background:#e05252;color:#fff;border:none;padding:14px 24px;font-size:15px;font-weight:800;border-radius:10px;cursor:pointer;display:none">⏸ 중지하고 지금까지 저장</button>
  <button id="downloadBtn" style="background:#5FD68A;color:#0D1B3E;border:none;padding:14px 24px;font-size:15px;font-weight:800;border-radius:10px;cursor:pointer;display:none">📥 지금까지 엑셀로 받기</button>
</div>

<div style="background:rgba(255,255,255,.08);border-radius:8px;height:10px;margin-bottom:8px;overflow:hidden">
  <div id="progressBar" style="width:0%;height:100%;background:linear-gradient(90deg,#5a8bff,#C8A84B);transition:width .3s"></div>
</div>
<div id="progress" style="margin-bottom:14px;font-size:13px;color:#9db3d8"></div>
<div id="log" style="font-family:monospace;font-size:12px;line-height:1.8;max-height:400px;overflow-y:auto;background:rgba(0,0,0,.2);border-radius:8px;padding:12px"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var API_KEY = '5e28545eb4cc2148cc0a3dc9eb8d273018db18537aa28ed21e7983ed66363aef';
var PAGE_SIZE = 100;
var companyMap = {};
var rawRecords = [];
var stopped = false;
var running = false;

function log(msg, color) {
  var d = document.createElement('div');
  d.style.color = color || '#0f0';
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  document.getElementById('log').appendChild(d);
  d.scrollIntoView();
}
function setProgress(msg, pct) {
  document.getElementById('progress').textContent = msg;
  if (pct != null) document.getElementById('progressBar').style.width = pct + '%';
}
function fmtDate(d) { return d.toISOString().slice(0,10); }
function toYMD(d) { return d.replace(/-/g,''); }

function setPreset(years) {
  var end = new Date();
  var start = new Date(); start.setFullYear(start.getFullYear() - years);
  document.getElementById('startDate').value = fmtDate(start);
  document.getElementById('endDate').value = fmtDate(end);
  updateRangeInfo();
}
document.getElementById('preset20').onclick = function(){ setPreset(20); };
document.getElementById('preset5').onclick = function(){ setPreset(5); };
document.getElementById('preset1').onclick = function(){ setPreset(1); };
document.getElementById('startDate').onchange = updateRangeInfo;
document.getElementById('endDate').onchange = updateRangeInfo;

function updateRangeInfo() {
  var s = document.getElementById('startDate').value;
  var e = document.getElementById('endDate').value;
  if (!s || !e) { document.getElementById('rangeInfo').textContent = ''; return; }
  var days = Math.round((new Date(e) - new Date(s)) / 86400000);
  var windows = Math.ceil(days / 30);
  document.getElementById('rangeInfo').textContent = '총 ' + days + '일 · 약 ' + windows + '개 구간 (분야 3개 × 구간)';
}
setPreset(20); // 기본값

async function naraFetch(ep, qs) {
  try {
    var url = '/api/nara?' + qs + '&_ep=' + ep + '&_svc=ScsbidInfoService';
    var r = await fetch(url, {signal: AbortSignal.timeout(12000)});
    var txt = await r.text();
    if (!txt || txt.length < 50) return { items: [], totalCount: 0, quotaError: false };
    if (txt.indexOf('_debug') >= 0) return { items: [], totalCount: 0, quotaError: false };
    if (txt.indexOf('nkoneps.com.response.ResponseError') >= 0) {
      var ej = JSON.parse(txt);
      var eh = (ej['nkoneps.com.response.ResponseError']||{}).header || {};
      var isQuota = /트래픽|한도|초과|LIMITED/i.test(eh.resultMsg||'') || eh.resultCode==='22' || eh.resultCode==='30';
      log('⚠️ API 오류: [' + (eh.resultCode||'?') + '] ' + (eh.resultMsg||''), isQuota?'#f44':'#fa0');
      return { items: [], totalCount: 0, quotaError: isQuota };
    }
    var j = JSON.parse(txt);
    var body = (j.response && j.response.body) || j.body || j;
    var hdr = (j.response && j.response.header) || {};
    if (hdr.resultCode && hdr.resultCode !== '00') {
      log('⚠️ 결과코드: ' + hdr.resultCode + ' ' + hdr.resultMsg, '#fa0');
      return { items: [], totalCount: 0, quotaError: false };
    }
    var bi = body.items;
    var its = Array.isArray(bi) ? bi : (bi && bi.item ? (Array.isArray(bi.item)?bi.item:[bi.item]) : []);
    return { items: its, totalCount: parseInt(body.totalCount)||0, quotaError: false };
  } catch(e) {
    log('⚠️ 네트워크 오류: ' + e.message, '#fa0');
    return { items: [], totalCount: 0, quotaError: false };
  }
}

function aggregate(items) {
  items.forEach(function(s) {
    var bizno = s.bidwinnrBizno || '';
    var nm = s.bidwinnrNm || '';
    if (!bizno && !nm) return;
    var key = bizno || nm;
    var amt = parseFloat(s.sucsfbidAmt || 0);
    var dt = s.fnlSucsfDate || s.rlOpengDt || s.rgstDt || '';
    var fld = s.bidClsfcNo || '';
    var org = s.dminsttNm || '';

    if (!companyMap[key]) companyMap[key] = { nm:nm, bizno:bizno, count:0, totalAmt:0, fields:new Set(), orgs:new Set(), firstDate:dt, lastDate:dt };
    var m = companyMap[key];
    m.count++;
    m.totalAmt += amt;
    if (fld) m.fields.add(fld);
    if (org) m.orgs.add(org);
    if (dt > m.lastDate) m.lastDate = dt;
    if (dt && dt < m.firstDate) m.firstDate = dt;

    rawRecords.push({
      '낙찰업체명': s.bidwinnrNm || '',
      '사업자등록번호': s.bidwinnrBizno || '',
      '대표자명': s.bidwinnrCeoNm || '',
      '업체주소': s.bidwinnrAdrs || '',
      '업체전화번호': s.bidwinnrTelNo || '',
      '최종낙찰금액': s.sucsfbidAmt ? parseFloat(s.sucsfbidAmt) : '',
      '최종낙찰률(%)': s.sucsfbidRate || '',
      '수요기관명': s.dminsttNm || '',
      '입찰공고명': s.bidNtceNm || '',
      '입찰공고번호': s.bidNtceNo || '',
      '분야': {'1':'공사','2':'용역','3':'물품'}[fld] || fld || '',
      '실개찰일시': s.rlOpengDt || '',
      '최종낙찰일자': s.fnlSucsfDate || '',
      '등록일시': s.rgstDt || '',
      '참가업체수': s.prtcptCnum || ''
    });
  });
}

function makeWindows(startYMD, endYMD) {
  var windows = [];
  var cursorEnd = new Date(endYMD.slice(0,4)+'-'+endYMD.slice(4,6)+'-'+endYMD.slice(6,8));
  var startD = new Date(startYMD.slice(0,4)+'-'+startYMD.slice(4,6)+'-'+startYMD.slice(6,8));
  while (cursorEnd > startD) {
    var winStart = new Date(cursorEnd); winStart.setDate(winStart.getDate() - 29);
    if (winStart < startD) winStart = new Date(startD);
    windows.push({ bgn: toYMD(fmtDate(winStart)), end: toYMD(fmtDate(cursorEnd)) });
    cursorEnd = new Date(winStart); cursorEnd.setDate(cursorEnd.getDate() - 1);
  }
  return windows;
}

function exportToExcel() {
  var rows = Object.values(companyMap).map(function(m) {
    return {
      '업체명': m.nm, '사업자번호': m.bizno, '낙찰횟수': m.count,
      '누적낙찰금액': m.totalAmt, '평균낙찰금액': m.count?Math.round(m.totalAmt/m.count):0,
      '분야': Array.from(m.fields).map(function(f){return {'1':'공사','2':'용역','3':'물품'}[f]||f;}).join(', '),
      '주요수요기관': Array.from(m.orgs).slice(0,10).join(', '),
      '최초낙찰일': m.firstDate, '최근낙찰일': m.lastDate
    };
  }).sort(function(a,b){ return b['낙찰횟수']-a['낙찰횟수']; });

  if (!rows.length && !rawRecords.length) { log('❌ 내려받을 데이터가 아직 없습니다', '#f44'); return; }

  var wb = XLSX.utils.book_new();
  if (rows.length) {
    var ws1 = XLSX.utils.json_to_sheet(rows);
    ws1['!cols'] = [{wch:28},{wch:14},{wch:10},{wch:14},{wch:14},{wch:16},{wch:50},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws1, '업체별집계');
  }
  if (rawRecords.length) {
    var ws2 = XLSX.utils.json_to_sheet(rawRecords);
    ws2['!cols'] = [{wch:26},{wch:14},{wch:10},{wch:35},{wch:16},{wch:14},{wch:12},{wch:24},{wch:40},{wch:16},{wch:8},{wch:20},{wch:12},{wch:20},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws2, '건별원본데이터');
  }

  var today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  var stampedName = 'LeadGrade_직접수집_' + rows.length + '개사_' + rawRecords.length + '건_' + today + '.xlsx';
  XLSX.writeFile(wb, stampedName);
  log('✅ 엑셀 다운로드 완료 (업체별집계 ' + rows.length + '개사 · 건별원본 ' + rawRecords.length + '건)', '#0f0');
}

document.getElementById('downloadBtn').onclick = exportToExcel;
document.getElementById('stopBtn').onclick = function(){
  stopped = true;
  log('⏸ 사용자가 중지 요청 — 현재 구간까지만 마무리합니다', '#fa0');
};

document.getElementById('btn').onclick = async function() {
  var startYMD = toYMD(document.getElementById('startDate').value);
  var endYMD = toYMD(document.getElementById('endDate').value);
  if (!startYMD || !endYMD) { alert('시작일/종료일을 선택하세요'); return; }

  this.disabled = true; running = true; stopped = false;
  document.getElementById('stopBtn').style.display = '';
  document.getElementById('downloadBtn').style.display = '';
  companyMap = {}; rawRecords = [];

  var windows = makeWindows(startYMD, endYMD);
  var eps = ['getScsbidListSttusCnstwk','getScsbidListSttusServc','getScsbidListSttusThng'];

  log('🚀 수집 시작 — ' + document.getElementById('startDate').value + ' ~ ' + document.getElementById('endDate').value + ' (총 ' + windows.length + '개 구간)');

  for (var wi = 0; wi < windows.length; wi++) {
    if (stopped) { log('🛑 사용자 중지로 수집을 멈췄습니다'); break; }
    var w = windows[wi];
    var pct = Math.round(((wi+1)/windows.length)*100);
    setProgress('[' + (wi+1) + '/' + windows.length + '] ' + w.bgn + '~' + w.end + ' 처리 중... (누적 ' + Object.keys(companyMap).length + '개사 · ' + rawRecords.length + '건)', pct);

    var windowItemCount = 0;
    // 3개 분야 병렬 호출로 속도 개선
    var results = await Promise.all(eps.map(async function(ep){
      var qs = 'ServiceKey=' + API_KEY + '&pageNo=1&numOfRows=' + PAGE_SIZE + '&type=json&inqryDiv=1&inqryBgnDt=' + w.bgn + '0000&inqryEndDt=' + w.end + '2359';
      return await naraFetch(ep, qs);
    }));

    var anyQuotaError = false;
    for (var ri = 0; ri < results.length; ri++) {
      var r1 = results[ri];
      if (r1.quotaError) { anyQuotaError = true; continue; }
      aggregate(r1.items);
      windowItemCount += r1.items.length;
      var pages = Math.min(Math.ceil(r1.totalCount / PAGE_SIZE), 5);
      for (var pg = 2; pg <= pages; pg++) {
        var qs2 = 'ServiceKey=' + API_KEY + '&pageNo=' + pg + '&numOfRows=' + PAGE_SIZE + '&type=json&inqryDiv=1&inqryBgnDt=' + w.bgn + '0000&inqryEndDt=' + w.end + '2359';
        var rp = await naraFetch(eps[ri], qs2);
        if (rp.quotaError) { anyQuotaError = true; break; }
        if (!rp.items.length) break;
        aggregate(rp.items);
        windowItemCount += rp.items.length;
      }
    }

    if (anyQuotaError) {
      log('🛑 일일 호출 한도 초과로 중단합니다. 지금까지 모은 데이터(' + Object.keys(companyMap).length + '개사 · ' + rawRecords.length + '건)는 엑셀로 받으세요.', '#f44');
      stopped = true;
    }

    log('[' + (wi+1) + '/' + windows.length + '] ' + w.bgn + '~' + w.end + ' · 이번구간 ' + windowItemCount + '건 · 누적 ' + Object.keys(companyMap).length + '개사 · ' + rawRecords.length + '건');

    if (rawRecords.length > 0 && (wi+1) % 30 === 0) {
      log('💾 안전을 위해 지금까지 데이터를 저장하시려면 [지금까지 엑셀로 받기]를 눌러도 됩니다', '#7BAAF7');
    }
  }

  log('📦 수집 종료 — 업체 ' + Object.keys(companyMap).length + '개사, 원본 ' + rawRecords.length + '건 확보');
  setProgress('완료 — 아래 버튼으로 엑셀을 받으세요', 100);
  this.disabled = false;
  running = false;
  document.getElementById('stopBtn').style.display = 'none';
  exportToExcel();
};
</script>
</body></html>
